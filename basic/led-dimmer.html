<meta name="theme-color" content="#2E5E4E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --skin:#2E5E4E; --skin-dark:#1C3B31; --skin-soft:#8FC7B2;
  --mat:var(--skin); --mat-line:rgba(255,255,255,.08);
  --mdf:#D9BC92; --mdf-edge:#8A5A33; --burn:#5C3A1E;
  --page:#EEF2EF; --surface:#FFFFFF; --ink:#1E2B28; --muted:#55645F; --rule:#D3DCD7;
  --accent:#F2B705; --ok:#2A9D3F; --bad:#C8323F;
  --w-red:#D7263D; --w-orange:#E8762D; --w-blue:#1E6FD9; --w-black:#222; --w-white:#9AA5A1;
  --code-bg:#17241F; --code-ink:#E4EEE9; --code-hi:rgba(242,183,5,.22);
  --r-plate:10px; --r-small:6px;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --mat:var(--skin-dark); --page:#121A17; --surface:#1A2420; --ink:#E6EEEA; --muted:#9DB0A8; --rule:#2C3A35;
    --mdf:#B89A70; --mdf-edge:#6E4526; --burn:#3E2611; --code-bg:#0E1714; --w-black:#C9D3CF;
  }
}
:root[data-theme="dark"]{
  --mat:var(--skin-dark); --page:#121A17; --surface:#1A2420; --ink:#E6EEEA; --muted:#9DB0A8; --rule:#2C3A35;
  --mdf:#B89A70; --mdf-edge:#6E4526; --burn:#3E2611; --code-bg:#0E1714; --w-black:#C9D3CF;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}

.mat{background-color:var(--mat);color:#F3F7F5;
  background-image:var(--pattern);
  background-size:20px 20px}
.mat h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.mat p{margin:0;color:#CFE0D8;max-width:60ch}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--page);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:6px;height:52px}
.back{color:var(--ink);font-weight:500;padding:8px 6px;font-size:15px;text-decoration:none;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs a{flex:none;text-decoration:none;font-size:14px;padding:6px 10px;border-radius:var(--r-small);color:var(--muted)}
.tabs a:hover{background:var(--surface);color:var(--ink)}

.hero{padding-top:28px;padding-bottom:32px}
.hero .meta{font-size:14px;color:#CFE0D8;margin-bottom:6px;font-family:var(--mono)}
.stage{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:20px;margin-top:24px;align-items:stretch}
@media (max-width:680px){.stage{grid-template-columns:1fr}}
.room{border-radius:var(--r-plate);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:background .3s}
.room svg{width:150px;height:auto}
.slider{width:100%}
.slider label{display:flex;justify-content:space-between;font-size:14px;color:#F3F7F5}
.slider input{width:100%;accent-color:var(--accent);height:28px}
.reading{font-family:var(--mono);font-size:14px;color:#F3F7F5;text-align:center}
.reading b{font-size:22px;display:block;color:var(--accent)}
.right-col{display:grid;gap:12px;grid-template-rows:1fr auto}
.live-code{background:var(--code-bg);border-radius:var(--r-plate);padding:14px 0;font-family:var(--mono);font-size:13.5px;line-height:1.7;overflow-x:auto;color:var(--code-ink)}
.live-code .ln{padding:0 16px;white-space:pre;border-left:3px solid transparent;transition:background .2s}
.live-code .ln.on{background:var(--code-hi);border-left-color:var(--accent)}
.serial{background:#0B1310;border-radius:var(--r-plate);padding:10px 14px;font-family:var(--mono);font-size:13px;color:#8FE3A8;height:96px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.serial .t{color:#5F7A6F;font-size:11px;margin-bottom:auto}

section.block{padding:40px 0 8px}
section.block h2{font-size:26px;line-height:1.2;margin:0 0 6px}
section.block .lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.step-tag{display:inline-block;font-family:var(--mono);font-size:13px;color:var(--mat);font-weight:600;margin-bottom:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step-tag{color:var(--skin-soft)}}
:root[data-theme="dark"] .step-tag{color:var(--skin-soft)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-plate);padding:18px 20px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{border-bottom:1px solid var(--rule)}
.checklist li:last-child{border-bottom:0}
.checklist label{display:flex;gap:12px;align-items:center;padding:10px 2px;cursor:pointer}
.checklist input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.checklist .qty{font-family:var(--mono);font-weight:600;min-width:34px;display:inline-block}
.checklist .pn{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--burn);background:var(--mdf);padding:1px 7px;border-radius:4px;flex:none}
.checklist input:checked ~ span{text-decoration:line-through;color:var(--muted)}
.check-status{font-size:14px;color:var(--muted);margin-top:10px}

ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
ol.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--mdf);border:2px solid var(--mdf-edge);color:var(--burn);font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps p{margin:4px 0 0}
.tip{border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 var(--r-small) var(--r-small) 0;margin-top:18px;font-size:15px}

.diagram{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-plate);padding:14px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:330px;max-width:660px;margin:0 auto;height:auto}
.diagram text{font-family:var(--font);fill:var(--ink)}
.table-wrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

.code-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--page);padding:9px 16px;border-radius:var(--r-small);font-weight:500;font-size:15px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--rule)}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r-plate);padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.65;margin:0}
.c{color:#7FA595}.k{color:#F2B705}.f{color:#7CC4FF}.n{color:#FF9E7A}

.explain{display:grid;gap:14px}
.explain .card h3{margin:0 0 4px;font-size:18px}

const SKINS = [["mat","Mat","#2E5E4E"],["ocean","Ocean","#1F4E79"],["terracotta","Clay","#9A4A24"],["grape","Grape","#4E3172"],["graphite","Graphite","#33404D"]];
const PATTERNS = [["grid","Grid"],["dots","Dots"],["plain","Plain"]];
const MODES = [["auto","Auto"],["light","Light"],["dark","Dark"]];
function getLook(){ let v={}; try{ v=JSON.parse(localStorage.getItem(KIT_INFO.key+"-look"))||{}; }catch(e){}
  return {skin:v.skin||KIT_INFO.defaultSkin, pattern:v.pattern||KIT_INFO.defaultPattern, mode:v.mode||"auto"}; }
function applyLook(l){ const r=document.documentElement;
  r.dataset.skin=l.skin; r.dataset.pattern=l.pattern;
  if(l.mode==="auto") delete r.dataset.theme; else r.dataset.theme=l.mode; }
function saveLook(l){ try{ localStorage.setItem(KIT_INFO.key+"-look",JSON.stringify(l)); }catch(e){} applyLook(l); }
applyLook(getLook());
const themeBtnHTML = `<button class="theme-btn" data-theme-btn aria-label="Change page colours" title="Page colours">🎨</button>`;
function bindThemeBtn(){
  document.querySelectorAll("[data-theme-btn]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openThemePicker(); });
}
function openThemePicker(){
  const old=$(".theme-pop"); if(old){ old.remove(); return; }
  const p=document.createElement("div"); p.className="theme-pop"; p.setAttribute("role","dialog"); p.setAttribute("aria-label","Page colours");
  const draw=()=>{ const l=getLook();
    p.innerHTML=`<button class="close" aria-label="Close">×</button>
      <h4>Colour</h4><div class="swatches">${SKINS.map(([id,n,c])=>`<button class="sw" data-skin="${id}" aria-pressed="${l.skin===id}"><i style="background:${c}"></i>${n}</button>`).join("")}</div>
      <h4>Background</h4><div class="row">${PATTERNS.map(([id,n])=>`<button class="seg" data-pattern="${id}" aria-pressed="${l.pattern===id}">${n}</button>`).join("")}</div>
      <h4>Mode</h4><div class="row">${MODES.map(([id,n])=>`<button class="seg" data-mode="${id}" aria-pressed="${l.mode===id}">${n}</button>`).join("")}</div>`;
    p.querySelector(".close").onclick=()=>{ p.remove(); };
    p.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{ saveLook({...getLook(),skin:b.dataset.skin}); draw(); });
    p.querySelectorAll("[data-pattern]").forEach(b=>b.onclick=()=>{ saveLook({...getLook(),pattern:b.dataset.pattern}); draw(); });
    p.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ saveLook({...getLook(),mode:b.dataset.mode}); draw(); });
  };
  p.addEventListener("click",e=>e.stopPropagation());
  draw(); document.body.appendChild(p);
  setTimeout(()=>document.addEventListener("click",function out(e){ if(!p.contains(e.target)){ p.remove(); document.removeEventListener("click",out); } }),0);
}
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const LEVELS = ["","Starter","Builder","Maker","Expert"];
/* difficulty shown as "Level n" with step bars, so it can't be mistaken for a star rating */
const levelBadge = n=>`<span class="lvl" aria-label="Difficulty: level ${n} of 4, ${LEVELS[n]}"><span class="bars" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}" style="height:${3+i*2}px"></i>`).join("")}</span>Level ${n}</span>`;
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KIT_INFO.key)) || {done:[],parts:{}} }catch(e){ return {done:[],parts:{}} } },
  set(v){ try{ localStorage.setItem(KIT_INFO.key, JSON.stringify(v)) }catch(e){} }
};
function hl(line){
  let code=line, com=""; const i=line.indexOf("//");
  if(i>=0){ code=line.slice(0,i); com=line.slice(i); }
  return esc(code)
    .replace(/\b(void|const|int|byte|unsigned|long|bool|true|false|if|else|for|while|return|HIGH|LOW|OUTPUT|INPUT|INPUT_PULLUP|Servo)\b/g,'<span class="k">$1</span>')
    .replace(/\b(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|setup|loop|Serial|begin|println|map|random|randomSeed|attach|write|tone|noTone|millis|print)\b/g,'<span class="f">$1</span>')
    .replace(/\b(\d+)\b/g,'<span class="n">$1</span>')
    + (com ? '<span class="c">'+esc(com)+'</span>' : "");
}

/* ---------- wiring diagram builder ----------
   rows: [{pin, wire:"var(--w-red)", parts:[{t:"R",v:"220"}, {t:"LED",c:"#D7263D",label:"red LED"}]}]
   every row runs pin → parts → GND bus */
const BANDS = {"220":["#C8323F","#C8323F","#7A4A1E"], "10k":["#7A4A1E","#222","#E8762D"], "1k":["#7A4A1E","#222","#C8323F"]};
function wiringSVG(rows,opts={}){
  const top=opts.ldr?150:50, gap=52, H=top+rows.length*gap+46, gndY=top+rows.length*gap+6, bus=392;
  let s=`<svg viewBox="0 0 430 ${H}" role="img" aria-label="Wiring diagram">
    <rect x="8" y="26" width="96" height="${H-36}" rx="8" fill="#1B7F8C"/>
    <text x="56" y="18" text-anchor="middle" font-size="12" font-weight="500">Arduino Uno</text>`;
  const pinBox=(y,label)=>`<rect x="94" y="${y-6}" width="12" height="12" fill="#222"/>
    <text x="88" y="${y+4}" text-anchor="end" font-size="11" style="fill:#fff">${label}</text>`;
  const wire=(x1,x2,y,c)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
  if(opts.ldr){
    s+=pinBox(50,"5V")+pinBox(100,"A0");
    s+=wire(106,170,50,"var(--w-red)")+`<rect x="170" y="42" width="44" height="16" rx="8" fill="#F4E3C1" stroke="#8A5A33" stroke-width="1.5"/>
      <path d="M178 46 q3 4 0 8 M186 46 q3 4 0 8 M194 46 q3 4 0 8 M202 46 q3 4 0 8" stroke="#C8323F" stroke-width="1.5" fill="none"/>
      <text x="192" y="36" text-anchor="middle" font-size="10" font-weight="500">LDR</text>`;
    s+=wire(214,250,50,"var(--w-orange)")+`<line x1="250" y1="50" x2="250" y2="100" stroke="var(--w-orange)" stroke-width="4" stroke-linecap="round"/>`;
    s+=wire(106,290,100,"var(--w-orange)")+`<circle cx="250" cy="100" r="5" fill="var(--w-orange)"/>`;
    const b=BANDS["10k"];
    s+=`<rect x="290" y="93" width="44" height="14" rx="6" fill="#D9BC92" stroke="#8A5A33"/>
      <rect x="300" y="93" width="4" height="14" fill="${b[0]}"/><rect x="308" y="93" width="4" height="14" fill="${b[1]}"/><rect x="316" y="93" width="4" height="14" fill="${b[2]}"/>
      <text x="312" y="88" text-anchor="middle" font-size="10">10 kΩ</text>`+wire(334,bus,100,"var(--w-black)");
  }
  rows.forEach((r,i)=>{
    const y=top+i*gap; let x=106;
    s+=pinBox(y,r.pin);
    r.parts.forEach(p=>{
      if(p.t==="R"){
        s+=wire(x,x+26,y,r.wire); x+=26;
        const b=BANDS[p.v]||BANDS["220"];
        s+=`<rect x="${x}" y="${y-7}" width="44" height="14" rx="6" fill="#D9BC92" stroke="#8A5A33"/>
          <rect x="${x+10}" y="${y-7}" width="4" height="14" fill="${b[0]}"/><rect x="${x+18}" y="${y-7}" width="4" height="14" fill="${b[1]}"/><rect x="${x+26}" y="${y-7}" width="4" height="14" fill="${b[2]}"/>
          <text x="${x+22}" y="${y-12}" text-anchor="middle" font-size="10">${p.v==="10k"?"10 kΩ":p.v==="1k"?"1 kΩ":"220 Ω"}</text>`;
        x+=44;
      } else if(p.t==="LED"){
        s+=wire(x,x+26,y,r.wire); x+=26;
        s+=`<circle cx="${x+13}" cy="${y}" r="13" fill="${p.c}" stroke="#00000040" stroke-width="2"/>
          <text x="${x-6}" y="${y-10}" font-size="11" font-weight="700">+</text>
          <text x="${x+28}" y="${y-10}" font-size="11" font-weight="700">−</text>
          <text x="${x+13}" y="${y+26}" text-anchor="middle" font-size="10">${p.label}</text>`;
        x+=26;
      } else if(p.t==="BTN"){
        s+=wire(x,x+40,y,r.wire); x+=40;
        s+=`<rect x="${x}" y="${y-13}" width="26" height="26" rx="4" fill="#3B4542"/><circle cx="${x+13}" cy="${y}" r="8" fill="#E5A800"/>
          <text x="${x+13}" y="${y+26}" text-anchor="middle" font-size="10">${p.label||"button"}</text>`;
        x+=26;
      } else if(p.t==="TILT"){
        s+=wire(x,x+40,y,r.wire); x+=40;
        s+=`<rect x="${x}" y="${y-9}" width="34" height="18" rx="9" fill="#B8C2BF" stroke="#6B7672"/><circle cx="${x+10}" cy="${y}" r="5" fill="#59625F"/>
          <text x="${x+17}" y="${y+26}" text-anchor="middle" font-size="10">${p.label||"tilt switch"}</text>`;
        x+=34;
      } else if(p.t==="MODULE"){
        s+=wire(x,x+40,y,r.wire); x+=40;
        s+=`<rect x="${x}" y="${y-16}" width="56" height="32" rx="4" fill="#1F3F8A"/>
          <rect x="${x+30}" y="${y-8}" width="9" height="16" rx="4" fill="#B8C2BF"/>
          <text x="${x+4}" y="${y-4}" font-size="7" style="fill:#fff">DO</text><text x="${x+4}" y="${y+5}" font-size="7" style="fill:#fff">GND</text><text x="${x+4}" y="${y+14}" font-size="7" style="fill:#fff">VCC</text>
          <text x="${x+28}" y="${y+30}" text-anchor="middle" font-size="10">${p.label||"module"}</text>
          <text x="${x+28}" y="${y-22}" text-anchor="middle" font-size="9">VCC → 5V</text>`;
        x+=56;
      } else if(p.t==="SERVO"){
        s+=wire(x,x+40,y,r.wire); x+=40;
        s+=`<rect x="${x}" y="${y-14}" width="50" height="28" rx="4" fill="#2E5FA8"/><circle cx="${x+14}" cy="${y}" r="7" fill="#fff"/>
          <text x="${x+25}" y="${y+28}" text-anchor="middle" font-size="10">SG90 servo</text>
          <text x="${x+25}" y="${y-20}" text-anchor="middle" font-size="9">red wire → 5V</text>`;
        x+=50;
      } else if(p.t==="BUZ"){
        s+=wire(x,x+40,y,r.wire); x+=40;
        s+=`<circle cx="${x+13}" cy="${y}" r="13" fill="#222"/><circle cx="${x+13}" cy="${y}" r="3" fill="#666"/>
          <text x="${x-6}" y="${y-10}" font-size="11" font-weight="700">+</text>
          <text x="${x+13}" y="${y+26}" text-anchor="middle" font-size="10">${p.label||"buzzer"}</text>`;
        x+=26;
      }
    });
    s+=wire(x,bus,y,"var(--w-black)");
  });
  s+=`<line x1="${bus}" y1="${opts.ldr?96:top-4}" x2="${bus}" y2="${gndY}" stroke="var(--w-black)" stroke-width="4" stroke-linecap="round"/>
    <text x="${bus+12}" y="${(top+gndY)/2}" font-size="11" transform="rotate(90 ${bus+12} ${(top+gndY)/2})" text-anchor="middle">GND row (−)</text>
    ${pinBox(gndY,"GND")}${wire(106,bus,gndY,"var(--w-black)")}</svg>`;
  return s;
}

  /* ---------- demo API ---------- */
  const lns=[...document.querySelectorAll("#live .ln")];
  const liveLines=live.slice();
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const findLine=s=>{const [t,n]=s.split("#"); let k=+n||1;
    for(let i=0;i<liveLines.length;i++) if(liveLines[i].includes(t) && --k===0) return i; return -1;};
  let AC=null, soundOn=true;
  const api={
    reduced,
    /* play a square-wave note through the speakers (like the passive buzzer). ms omitted = hold until .stop() */
    tone(freq,ms){ if(!soundOn) return null; try{
        AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
        const o=AC.createOscillator(), g=AC.createGain(); o.type="square"; o.frequency.value=freq; g.gain.value=0.035;
        o.connect(g); g.connect(AC.destination); o.start(); if(ms) o.stop(AC.currentTime+ms/1000); return o;
      }catch(e){ return null; } },
    soundButton(){ const b=document.createElement("button"); b.className="stage-btn"; b.textContent="🔊 Sound on";
      b.onclick=()=>{ soundOn=!soundOn; b.textContent=soundOn?"🔊 Sound on":"🔇 Sound off"; }; $("#ctl").appendChild(b); },
    hi(list){ lns.forEach(l=>l.classList.remove("on")); (list||[]).forEach(s=>{const i=findLine(s); if(i>=0) lns[i].classList.add("on");}); },
    setLine(find,text){ const i=findLine(find); if(i>=0){ liveLines[i]=text; lns[i].innerHTML=hl(text); } },
    serial(t){ const ser=$("#ser"); if(!ser) return; const d=document.createElement("div"); d.textContent=t; ser.appendChild(d); while(ser.children.length>4) ser.firstChild.remove(); },
    timer(t){ $("#timer").textContent=t||""; },
    controls(html){ $("#ctl").innerHTML=html; },
    /* looping player with Play / Pause / 4× buttons. phases: array or function returning array */
    sequencer(phases,onPhase){
      let speed=1, playing=false, step=0, to=null, tick=null, list=[];
      api.controls(`<button data-p aria-pressed="false">Play</button><button data-s aria-pressed="false">4× speed</button>`);
      const pb=$("#ctl [data-p]"), sb=$("#ctl [data-s]");
      const run=()=>{
        if(step>=list.length||!list.length){ list=typeof phases==="function"?phases():phases; step=0; }
        const ph=list[step], ms=typeof ph.ms==="function"?ph.ms():ph.ms;
        onPhase(ph); api.hi(ph.hi);
        const t0=Date.now(); clearInterval(tick);
        if(ms>=500) tick=setInterval(()=>api.timer(`${ph.label||"delay"}: ${Math.max(0,(ms-(Date.now()-t0)*speed)/1000).toFixed(1)} s left`),100);
        else api.timer(ph.label||"");
        to=setTimeout(()=>{step++; run();}, ms/speed);
      };
      const set=on=>{playing=on; pb.setAttribute("aria-pressed",on); pb.textContent=on?"Pause":"Play";
        if(on) run(); else {clearTimeout(to); clearInterval(tick);} };
      pb.onclick=()=>set(!playing);
      sb.onclick=()=>{speed=speed===1?4:1; sb.setAttribute("aria-pressed",speed===4); if(playing){clearTimeout(to);clearInterval(tick);run();}};
      if(!reduced) set(true); else api.timer("Press Play to run the code");
      return {stop:()=>set(false)};
    },
    /* plays phases once, then calls done() */
    runOnce(phases,onPhase,done){
      let step=0, tick=null;
      const run=()=>{ if(step>=phases.length){ clearInterval(tick); api.timer(""); done&&done(); return; }
        const ph=phases[step]; onPhase(ph); api.hi(ph.hi);
        const t0=Date.now(); clearInterval(tick);
        if(ph.ms>=500) tick=setInterval(()=>api.timer(`${ph.label||"delay"}: ${Math.max(0,(ph.ms-(Date.now()-t0))/1000).toFixed(1)} s left`),100);
        else api.timer(ph.label||"");
        setTimeout(()=>{step++; run();}, ph.ms); };
      run();
    }
  };
  if(P.demo) P.demo(api);
}

/* ---------- 3D assembly viewer (canvas, no libraries) ---------- */
function viewer3D(host,M){
  host.innerHTML=`<canvas aria-label="3D model of the assembled project. Drag to turn it." role="img"></canvas>
   <div class="v3d-bar"><button class="btn" data-ex aria-pressed="false">Exploded view</button><button class="btn alt" data-reset>Reset view</button>
   <span class="v3d-hint">Drag to turn the model</span></div>`;
  const cv=host.querySelector("canvas"), ctx=cv.getContext("2d");
  let yaw=M.yaw*Math.PI/180, pitch=M.pitch*Math.PI/180, ex=0, exT=0, auto=!matchMedia("(prefers-reduced-motion: reduce)").matches, raf;
  const C=M.center, add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  /* build faces once (model space); explode offset applied per face */
  const faces=[], labels=[], lines=[];
  M.plates.forEach(p=>{
    const n=cross(p.u,p.v), P=(x,y,d)=>add(add(add(p.o,p.u,x),p.v,y),n,d);
    const f=p.pts.map(q=>P(q[0],q[1],0)), b=p.pts.map(q=>P(q[0],q[1],-p.t));
    const hole=(d)=>p.holes.map(h=>{ const r=[]; for(let i=0;i<16;i++){const a=i/16*2*Math.PI; r.push(P(h[0]+h[2]*Math.cos(a),h[1]+h[2]*Math.sin(a),d));} return r; });
    const L=p.layer===0?0.5:1;
    faces.push({pts:f,holes:hole(0),col:p.col,ex:p.ex,n,layer:L},{pts:b,holes:hole(-p.t),col:p.col,ex:p.ex,n:n.map(x=>-x),layer:L});
    for(let i=0;i<f.length;i++){ const j=(i+1)%f.length; faces.push({pts:[f[i],f[j],b[j],b[i]],holes:[],col:"#7A4A22",ex:p.ex,edge:1,layer:L}); }
    if(p.label){ const cx=p.pts.reduce((s,q)=>s+q[0],0)/p.pts.length, cy=p.pts.reduce((s,q)=>s+q[1],0)/p.pts.length; labels.push({p:P(cx,cy,0.5),t:p.label,ex:p.ex}); }
  });
  (M.extra||[]).forEach(e=>{
    if(e.box){ const [x,y,z]=e.box,[w,d,h]=e.size, v=(i,j,k)=>[x+i*w,y+j*d,z+k*h];
      [[v(0,0,1),v(1,0,1),v(1,1,1),v(0,1,1),[0,0,1]],[v(0,0,0),v(0,1,0),v(1,1,0),v(1,0,0),[0,0,-1]],[v(0,0,0),v(1,0,0),v(1,0,1),v(0,0,1),[0,-1,0]],
       [v(0,1,0),v(0,1,1),v(1,1,1),v(1,1,0),[0,1,0]],[v(0,0,0),v(0,0,1),v(0,1,1),v(0,1,0),[-1,0,0]],[v(1,0,0),v(1,1,0),v(1,1,1),v(1,0,1),[1,0,0]]]
       .forEach(q=>faces.push({pts:q.slice(0,4),holes:[],col:e.col,ex:e.ex,n:q[4],layer:e.layer}));
      if(e.label) labels.push({p:[x+w/2,y+d/2,z+h+2],t:e.label,ex:e.ex}); }
    if(e.line) lines.push(e);
  });
  const shade=(hex,k)=>{ const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(Math.min(255,v*k))); return `rgb(${c})`; };
  function frame(){
    if(auto) yaw+=0.003;
    exT+=(ex-exT)*0.12;
    const W=host.clientWidth, H=Math.min(380,Math.max(260,W*0.62)), dpr=window.devicePixelRatio||1;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const s=Math.min(W,H*1.5)/260*M.scale*(1-0.24*exT), cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    const prj=(q,e)=>{ const x=q[0]+e[0]*exT-C[0], y=q[1]+e[1]*exT-C[1], z=q[2]+e[2]*exT-C[2]-(M.exLift||20)*exT;
      const x1=x*cy-y*sy, y1=x*sy+y*cy, y2=y1*cp+z*sp, z2=-y1*sp+z*cp; return [W/2+x1*s, H/2-z2*s+H*0.06, y2]; };
    const rotN=n=>{ const x1=n[0]*cy-n[1]*sy, y1=n[0]*sy+n[1]*cy; return [x1, y1*cp+n[2]*sp, -y1*sp+n[2]*cp]; };
    const list=faces.map(f=>{ const P=f.pts.map(q=>prj(q,f.ex)); return {f,P,H:f.holes.map(h=>h.map(q=>prj(q,f.ex))),d:P.reduce((a,p)=>a+p[2],0)/P.length}; });
    lines.forEach(l=>{ const P=l.line.map(q=>prj(q,l.ex)); for(let i=0;i<P.length-1;i++) list.push({seg:[P[i],P[i+1]],col:l.col,f:{layer:1},d:(P[i][2]+P[i+1][2])/2}); });
    list.sort((a,b)=>(a.f.layer??1)-(b.f.layer??1) || a.d-b.d);
    for(const o of list){
      if(o.seg){ ctx.beginPath(); ctx.moveTo(o.seg[0][0],o.seg[0][1]); ctx.lineTo(o.seg[1][0],o.seg[1][1]); ctx.strokeStyle=o.col; ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.stroke(); continue; }
      let k=1; if(o.f.n){ const n=rotN(o.f.n); if(n[1]<=0.001) continue; k=0.6+0.4*Math.max(0,n[1]*0.55+n[2]*0.7+n[0]*0.2); }
      ctx.beginPath(); o.P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
      o.H.forEach(h=>{ h.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); });
      ctx.fillStyle=o.f.edge?o.f.col:shade(o.f.col,k); ctx.fill("evenodd");
      if(!o.f.edge){ ctx.strokeStyle="rgba(90,55,25,.55)"; ctx.lineWidth=0.8; ctx.stroke(); }
    }

    if(exT>0.5){ ctx.font="600 12px Lexend, system-ui, sans-serif"; ctx.textAlign="center";
      labels.forEach(L=>{ const p=prj(L.p,L.ex); const w=ctx.measureText(L.t).width+10;
        ctx.globalAlpha=Math.min(1,(exT-0.5)*2); ctx.fillStyle="rgba(20,28,25,.82)"; ctx.fillRect(p[0]-w/2,p[1]-10,w,18); ctx.fillStyle="#fff"; ctx.fillText(L.t,p[0],p[1]+3); ctx.globalAlpha=1; }); }
    raf=requestAnimationFrame(frame);
  }
  let drag=null;
  cv.onpointerdown=e=>{ drag=[e.clientX,e.clientY,yaw,pitch]; auto=false; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=e=>{ if(!drag) return; yaw=drag[2]-(e.clientX-drag[0])*0.01; pitch=Math.max(-0.2,Math.min(1.4,drag[3]+(e.clientY-drag[1])*0.01)); };
  cv.onpointerup=()=>drag=null;
  const eb=host.querySelector("[data-ex]");
  eb.onclick=()=>{ ex=ex?0:1; eb.setAttribute("aria-pressed",!!ex); eb.textContent=ex?"Assembled view":"Exploded view"; };
  host.querySelector("[data-reset]").onclick=()=>{ yaw=M.yaw*Math.PI/180; pitch=M.pitch*Math.PI/180; };
  frame();
}

 wiring:[["var(--w-red)","5V","Knob outer leg (left)"],["var(--w-orange)","A0","Knob middle leg"],["var(--w-blue)","Pin 9","220 Ω resistor → white LED long leg (+)"],

 wiringTip:"Look closely at the Arduino: pin 9 has a small <strong>~</strong> next to it. Only the ~ pins (3, 5, 6, 9, 10 and 11) can dim an LED.",
 uploadLast:"Press Upload, then turn the knob slowly from one end to the other.",
 codes:[{file:"led_dimmer.ino",code:`// LED dimmer: Basic Kit project B05
// Turn the knob to make the lamp brighter or dimmer

const int KNOB = A0;
const int LED = 9;              // only ~ pins can dim

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  int knob = analogRead(KNOB);   // 0 to 1023
  int brightness = knob / 4;     // 0 to 255
  analogWrite(LED, brightness);  // dim the LED
}`}],
 howLead:"Turn the knob in the demo and watch the yellow wave. It shows what pin 9 is really doing.",
 explain:[
  ["The knob shares out 5 volts","Inside the potentiometer is a strip of resistance with a slider. Turning it moves the slider, so the middle leg gets anywhere from 0 to 5 volts."],
  ["analogRead() turns volts into a number","<code>analogRead(KNOB)</code> gives 0 at one end of the knob and 1023 at the other."],
  ["Why divide by 4?","<code>analogWrite()</code> only accepts 0 to 255. Dividing 1023 by 4 gives about 255, so the two ranges match."],
  ["PWM: very fast blinking","A pin can only be fully on or fully off. To dim, <code>analogWrite()</code> switches it on and off about 490 times every second. Your eyes see the average, so on half the time looks half as bright."],
  ["It's a loop with no delay","<code>loop()</code> runs thousands of times a second, so the lamp follows the knob instantly."]],
 trouble:[["Lamp only fully on or off","Check the LED is on pin 9 (a ~ pin), not pin 8."],["Knob does nothing","The middle leg must go to A0. Check the 5V and GND wires on the outer legs."],["Brightest when turned left","That's fine: swap the 5V and GND wires on the knob to reverse it."]],
 challenges:[
  ["Reverse the knob",1,"Change the code so turning right makes it dimmer: <code>analogWrite(LED, 255 - brightness);</code>"],
  ["See the numbers",1,"Add <code>Serial.begin(9600);</code> in setup and <code>Serial.println(knob);</code> in loop. Open the Serial Monitor and turn the knob."],
  ["Use map()",2,"Replace <code>knob / 4</code> with <code>map(knob, 0, 1023, 0, 255)</code>. Then try <code>map(knob, 0, 1023, 20, 255)</code> so the lamp never goes fully dark."],
  ["Breathing lamp",3,"Remove the knob code and use a for loop to fade the lamp from 0 to 255 and back, slowly, like a sleeping laptop light."]],
 quiz:[["What range does analogRead() give?",["0 to 255","0 to 1023","0 to 5"],1],
  ["Why do we divide the knob reading by 4?",["To make analogWrite's 0–255 range match","To make the LED last longer","Because the knob has 4 positions"],0],
  ["Which pins can dim an LED with analogWrite()?",["Any pin","Only pins marked ~","Only A0 to A5"],1],
  ["With PWM at brightness 128, the LED is on for about…",["Half the time","All the time","A quarter of the time"],0]],
 teacher:["<strong>Links:</strong> fractions and percentages (duty cycle), ratios (dividing by 4), resistance and electric circuits.","<strong>Class plan:</strong> one period. Have students record knob numbers at 0, ¼, ½, ¾ and full turn.","<strong>Discussion:</strong> where else do we dim things? (fan regulators, phone screen brightness, car dashboards)"]
